<html>

<head>
	<title> Registration Form </title>
</head>

<body>
	<form method="post" action="login_form.php">
		<table border="10" width="1000" align="center">
			<tr>
				<td colspan="2" align="center"> Registration Form </td>
			</tr>

			<tr>
				<td> Enter User Name </td>
				<td> <input type="text" name="user_name" /> </td>
			</tr>

			<tr>
				<td> Enter User Email </td>
				<td> <input type="text" name="user_email" size="5" maxlength="30" /> </td>
			</tr>

			<tr>
				<td> Enter Password </td>
				<td> <input type="password" name="user_password" /> </td>
			</tr>

			<tr>
				<td> Confirm Password </td>
				<td> <input type="password" name="user_confirm_password" required="required" /> </td>
			</tr>

			<tr>
				<td> Select Country </td>
				<td>
					<select name="country_name">
						<option value="null"> Select Any Country </option>
						<option value="pak"> Paksitan </option>
						<option value="ind"> India </option>
						<option value="chi"> China </option>
						<option value="jap"> Japan </option>
					</select>
				</td>
			</tr>

			<tr>
				<td> Select Gender </td>
				<td>
					<select name="gender">
						<option value="null"> Select Gender </option>
						<option value="male"> Male </option>
						<option value="female"> Female </option>
				</td>
			</tr>

			<tr>
				<td> Image Button </td>
				<td> <input type="image" name="myimage" src="images/red.png" width="150px" /> </td>
			</tr>



			<tr>
				<td> Upload your stuff </td>
				<td> <input type="file" name="myfile" accept="images/png, images/jpeg" />
					<input type="file" id="avatar" name="avatar" accept="images/png" />
				</td>
			</tr>



			<tr>
				<td> Your Address </td>
				<td> <textarea cols="9" rows="3" required="required" /> </textarea> </td>
			</tr>



			<tr>
				<td> Radio Buttons </td>
				<td>
					<input type="radio" name="gender" value="male" checked="checked" /> Male
					<input type="radio" name="gender" value="female" />	Female
					<input type="radio" name="gender" value="other" />  Other
				</td>
			</tr>


			<tr>
				<td colspan="2">
				<fieldset>
					<legend> Contact Details </legend>
					<label>Your Email</label>
					<label><input type="email" name="user_email2" placeholder="email@yourdomain.com" required="required"/></label>
					<label>Your Phone Number</label>
					<label><input type="Number" name="user_phone_number" placeholder="03331234567" required="required"></label>
				</fieldset>	
				</td>
			</tr>
			
			<tr>
				<td colspan="2" align="center">
					<input type="submit" value="Submit" />
				</td>
			</tr>


		</table>
</body>

</html>
